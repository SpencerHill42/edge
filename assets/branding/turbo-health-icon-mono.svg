<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Turbo Health app icon, "Pro-Look – Graustufen" (Health), from the icon
       canvas https://claude.ai/artifact/5qyxBj2LV27jaYsMxLvcEY. Full square:
       iOS applies the corner mask itself. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3D"/>
      <stop offset="0.55" stop-color="#1E1E20"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#6E737B"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8A8F98"/>
    </radialGradient>
    <!-- The canvas's drop-shadow(0 0 10px rgba(255,255,255,.22)) at 196 px,
         scaled to 1024. -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#FFFFFF" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <polyline points="170,560 360,560 430,360 520,720 600,300 670,560 740,560" fill="none" stroke="url(#chrome)" stroke-width="68" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="170,550 360,550 430,350 520,710 600,290 670,550 740,550" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="840" cy="560" r="74" fill="url(#dot)"/>
  </g>
</svg>
